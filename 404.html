<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — DIAL·A·PHISH</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/dmbeoutyi/image/upload/v1779241581/phish-logo_al1k0a.png">
<meta name="theme-color" content="#2E3192">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;min-height:100vh;
  background:linear-gradient(160deg,#a8aee8 0%,#8ed8a8 22%,#ede070 48%,#edba78 72%,#ed9898 100%);background-attachment:fixed;}
.wrap{max-width:420px;width:100%;background:#fff;border:2px solid #C8C2B0;border-radius:20px;padding:28px 20px;box-shadow:0 6px 30px rgba(46,49,146,.08);}
.logo{width:90px;height:auto;margin-bottom:12px;}
.code{font-family:'Syne',sans-serif;font-size:clamp(48px,18vw,84px);font-weight:800;line-height:1;letter-spacing:6px;
  background:linear-gradient(90deg,#2E3192,#22B14C,#FFF200,#F7941E,#ED1C24);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.msg{margin-top:14px;font-size:13px;letter-spacing:3px;color:#2E3192;font-weight:700;}
.sub{margin-top:10px;font-size:11px;letter-spacing:2px;color:#444;line-height:2;}
.home{display:inline-block;margin-top:22px;background:linear-gradient(90deg,#2E3192,#22B14C,#FFF200,#F7941E,#ED1C24);color:#fff;
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;padding:13px 26px;border-radius:8px;text-decoration:none;
  box-shadow:0 0 20px rgba(168,85,247,.5);}
html.darkpuddle body{background:linear-gradient(160deg,#12154a 0%,#0a3018 22%,#2a2600 48%,#2a1200 72%,#2a0606 100%);background-attachment:fixed;}
html.darkpuddle .wrap{background:#111118;border-color:#2A2A3A;}
html.darkpuddle .msg{color:#F7941E;}
html.darkpuddle .sub{color:#888;}
</style>
<script>try{if(localStorage.getItem('darkPuddle'))document.documentElement.classList.add('darkpuddle')}catch(e){}</script>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="https://res.cloudinary.com/dmbeoutyi/image/upload/v1779241581/phish-logo_al1k0a.png" alt="" onerror="this.style.display='none'">
    <div class="code">404</div>
    <div class="msg">NOTHING ON THIS DATE</div>
    <div class="sub">That page isn't in the archive.<br>Dial a show date instead.</div>
    <a class="home" href="/">◀ BACK TO THE DIAL</a>
  </div>
</body>
</html>
