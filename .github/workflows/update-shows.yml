name: Update Phish Show Database

on:
  # Run every Monday at 6am UTC — picks up weekend shows
  schedule:
    - cron: '0 6 * * 1'
  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  update-shows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate shows.json
        run: python generate_phish.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet shows.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add shows.json
          git commit -m "Auto-update shows.json [$(date '+%Y-%m-%d')]"
          git push
